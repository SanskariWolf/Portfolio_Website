<footer class="footer-container">
  <div class="footer-main">
    <div class="footer-column left">
      <img src="./logo.svg" alt="Logo" class="footer-logo">
    </div>

    <div class="footer-column middle">
      <ul class="footer-nav">
        <li routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</li>
        <li routerLink="/about" routerLinkActive="active">About Me</li>
        <li routerLink="/projects" routerLinkActive="active">Projects</li>
        <li routerLink="/milestones" routerLinkActive="active">Milestones</li>
        <li routerLink="/contact" routerLinkActive="active">Contact Me</li>
      </ul>
    </div>

    <div class="footer-column right">
      <div class="social-icons">
        <a href="https://instagram.com/yourid" target="_blank" aria-label="Instagram">
          <img src="assets/social/instagram.svg" alt="Instagram">
        </a>
        <a href="https://x.com/yourid" target="_blank" aria-label="X">
          <img src="assets/social/x.svg" alt="X">
        </a>
        <a href="https://discord.com/users/yourid" target="_blank" aria-label="Discord">
          <img src="assets/social/discord.svg" alt="Discord">
        </a>
        <a href="https://t.me/yourid" target="_blank" aria-label="Telegram">
          <img src="assets/social/telegram.svg" alt="Telegram">
        </a>
        <a href="https://reddit.com/u/yourid" target="_blank" aria-label="Reddit">
          <img src="assets/social/reddit.svg" alt="Reddit">
        </a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© 2025 Tanush Purwar | Sanskari Wolf. All Rights Reserved.</p>
  </div>
</footer>
